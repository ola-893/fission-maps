[package]
name = "fission-maps"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Native MapKit maps for Fission applications on macOS and iOS"
license = "MIT"
repository = "https://github.com/ola-893/fission-maps"

[features]
default = []
# Available after fission-shell releases NativeSurfaceHandler.
native-surface-hook = ["dep:fission-shell"]

[dependencies]
bincode = "1.3"
fission-core = "0.9.0"
fission-ir = "0.9.0"
fission-shell = { version = "0.9.0", optional = true }
lazy_static = "1.5"
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
core-graphics = "0.23"
fission-render = "0.9.0"
objc = "0.2"
raw-window-handle = "0.6"

[workspace]

[target.'cfg(target_os = "ios")'.dependencies]
core-graphics = "0.23"
fission-render = "0.9.0"
objc = "0.2"
raw-window-handle = "0.6"
